services:
  nginx:
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"

  api-gateway:
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      USER_USERNAME: ${USER_USERNAME:-}
      USER_PASSWORD: ${USER_PASSWORD:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS}

  websocket-service:
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY}
      ADMIN_TOKEN: ${WEBSOCKET_ADMIN_TOKEN:?set WEBSOCKET_ADMIN_TOKEN}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS}

  cache-service:
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      ADMIN_TOKEN: ${CACHE_ADMIN_TOKEN:?set CACHE_ADMIN_TOKEN}

  vacancy-service:
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      HH_API_CLIENT_ID: ${HH_API_CLIENT_ID:-}
      HH_API_CLIENT_SECRET: ${HH_API_CLIENT_SECRET:-}
      HH_API_ACCESS_TOKEN: ${HH_API_ACCESS_TOKEN:-}

  analyzer-service:
    environment:
      ENVIRONMENT: production
      DEBUG: "false"

  grafana:
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
