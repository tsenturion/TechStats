services:
  nginx:
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"

  api-gateway:
    build:
      target: dev
    ports:
      - "${API_GATEWAY_PORT:-8000}:8000"
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      USER_USERNAME: ${USER_USERNAME:-user}
      USER_PASSWORD: ${USER_PASSWORD:-user}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-techstats-dev-jwt-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173","http://localhost:8080","http://localhost:8088"]}
    volumes:
      - ./api-gateway:/app
      - ./shared:/app/shared

  vacancy-service:
    build:
      target: dev
    ports:
      - "${VACANCY_SERVICE_PORT:-8001}:8001"
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
    volumes:
      - ./vacancy-service:/app
      - ./shared:/app/shared
      - ./vacancy-service/logs:/app/logs

  analyzer-service:
    build:
      target: dev
    ports:
      - "${ANALYZER_SERVICE_PORT:-8002}:8002"
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
    volumes:
      - ./analyzer-service:/app
      - ./shared:/app/shared
      - ./analyzer-service/logs:/app/logs
      - ./analyzer-service/data:/app/data

  cache-service:
    build:
      target: dev
    ports:
      - "${CACHE_SERVICE_PORT:-8003}:8003"
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      ADMIN_TOKEN: ${CACHE_ADMIN_TOKEN:-techstats-dev-cache-admin-token}
    volumes:
      - ./cache-service:/app
      - ./shared:/app/shared
      - ./cache-service/logs:/app/logs

  websocket-service:
    build:
      target: dev
    ports:
      - "${WEBSOCKET_SERVICE_PORT:-8004}:8004"
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-techstats-dev-jwt-secret}
      ADMIN_TOKEN: ${WEBSOCKET_ADMIN_TOKEN:-techstats-dev-websocket-admin-token}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173","http://localhost:8080","http://localhost:8088"]}
    volumes:
      - ./websocket-service:/app
      - ./shared:/app/shared
      - ./websocket-service/logs:/app/logs

  cache-service-2:
    build:
      context: .
      dockerfile: cache-service/Dockerfile
      target: dev
    profiles:
      - cache-cluster
    restart: unless-stopped
    ports:
      - "${CACHE_SERVICE_2_PORT:-8014}:8003"
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      NODE_ID: cache-node-2
      REDIS_URL: redis://redis:6379
      CACHE_BACKEND: redis
      CACHE_STRATEGY: lru
      DEFAULT_TTL_SECONDS: 3600
      ENABLE_CLUSTERING: "true"
      CLUSTER_NODES: http://cache-service:8003,http://cache-service-2:8003,http://cache-service-3:8003
      ADMIN_TOKEN: ${CACHE_ADMIN_TOKEN:-techstats-dev-cache-admin-token}
    volumes:
      - ./cache-service:/app
      - ./shared:/app/shared
    networks:
      - techstats-network
    depends_on:
      redis:
        condition: service_healthy
      cache-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 5

  cache-service-3:
    build:
      context: .
      dockerfile: cache-service/Dockerfile
      target: dev
    profiles:
      - cache-cluster
    restart: unless-stopped
    ports:
      - "${CACHE_SERVICE_3_PORT:-8015}:8003"
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      NODE_ID: cache-node-3
      REDIS_URL: redis://redis:6379
      CACHE_BACKEND: redis
      CACHE_STRATEGY: lru
      DEFAULT_TTL_SECONDS: 3600
      ENABLE_CLUSTERING: "true"
      CLUSTER_NODES: http://cache-service:8003,http://cache-service-2:8003,http://cache-service-3:8003
      ADMIN_TOKEN: ${CACHE_ADMIN_TOKEN:-techstats-dev-cache-admin-token}
    volumes:
      - ./cache-service:/app
      - ./shared:/app/shared
    networks:
      - techstats-network
    depends_on:
      redis:
        condition: service_healthy
      cache-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 5

  prometheus:
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}

  mongo:
    ports:
      - "${MONGO_PORT:-27017}:27017"
