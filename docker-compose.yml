name: techstats

x-backend-build: &backend-build
  context: .
  target: runtime

x-service-env: &service-env
  ENVIRONMENT: ${ENVIRONMENT:-production}
  DEBUG: ${DEBUG:-false}
  REDIS_URL: redis://redis:6379

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory ${REDIS_MAXMEMORY:-512mb} --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - techstats-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    networks:
      - techstats-network
    depends_on:
      redis:
        condition: service_healthy

  mongo:
    image: mongo:6
    profiles:
      - mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - techstats-network
    command: mongod --quiet --logpath /dev/null
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 5

  cache-service:
    build:
      <<: *backend-build
      dockerfile: cache-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: *service-env
      NODE_ID: ${CACHE_NODE_ID:-cache-node-1}
      MONGO_ENABLED: ${MONGO_ENABLED:-false}
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017}
      CACHE_BACKEND: ${CACHE_BACKEND:-redis}
      CACHE_STRATEGY: ${CACHE_STRATEGY:-lru}
      DEFAULT_TTL_SECONDS: ${DEFAULT_TTL_SECONDS:-3600}
      MAX_CACHE_SIZE_MB: ${MAX_CACHE_SIZE_MB:-1024}
      CLEANUP_INTERVAL_SECONDS: ${CLEANUP_INTERVAL_SECONDS:-300}
      ENABLE_CLUSTERING: ${ENABLE_CLUSTERING:-false}
      CLUSTER_NODES: ${CLUSTER_NODES:-}
      REDIS_CLUSTER_MODE: ${REDIS_CLUSTER_MODE:-false}
      REDIS_CLUSTER_NODES: ${REDIS_CLUSTER_NODES:-}
      API_RATE_LIMIT_PER_MINUTE: ${CACHE_API_RATE_LIMIT_PER_MINUTE:-1000}
      API_RATE_LIMIT_PER_HOUR: ${CACHE_API_RATE_LIMIT_PER_HOUR:-10000}
      ADMIN_TOKEN: ${CACHE_ADMIN_TOKEN:-}
    networks:
      - techstats-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/api/v1/health/ready')"]
      interval: 30s
      timeout: 10s
      retries: 5

  api-gateway:
    build:
      <<: *backend-build
      dockerfile: api-gateway/Dockerfile
    restart: unless-stopped
    environment:
      <<: *service-env
      VACANCY_SERVICE_URL: http://vacancy-service:8001
      ANALYZER_SERVICE_URL: http://analyzer-service:8002
      CACHE_SERVICE_URL: http://cache-service:8003
      WEBSOCKET_SERVICE_URL: http://websocket-service:8004
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      USER_USERNAME: ${USER_USERNAME:-}
      USER_PASSWORD: ${USER_PASSWORD:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8080"]}
    networks:
      - techstats-network
    depends_on:
      redis:
        condition: service_healthy
      vacancy-service:
        condition: service_healthy
      analyzer-service:
        condition: service_healthy
      cache-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready')"]
      interval: 30s
      timeout: 10s
      retries: 5

  vacancy-service:
    build:
      <<: *backend-build
      dockerfile: vacancy-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: *service-env
      HH_API_BASE_URL: ${HH_API_BASE_URL:-https://api.hh.ru}
      HH_API_HOST: ${HH_API_HOST:-hh.ru}
      HH_API_USER_AGENT: ${HH_API_USER_AGENT:-TechStats/1.0 (api@techstats.local)}
      HH_API_CLIENT_ID: ${HH_API_CLIENT_ID:-}
      HH_API_CLIENT_SECRET: ${HH_API_CLIENT_SECRET:-}
      HH_API_ACCESS_TOKEN: ${HH_API_ACCESS_TOKEN:-}
      HH_RATE_LIMIT_PER_SECOND: ${HH_RATE_LIMIT_PER_SECOND:-7}
      HH_RATE_LIMIT_PER_DAY: ${HH_RATE_LIMIT_PER_DAY:-50000}
      CACHE_TTL_HOURS: ${VACANCY_CACHE_TTL_HOURS:-24}
    networks:
      - techstats-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/v1/health/ready')"]
      interval: 30s
      timeout: 10s
      retries: 5

  analyzer-service:
    build:
      <<: *backend-build
      dockerfile: analyzer-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: *service-env
      VACANCY_SERVICE_URL: http://vacancy-service:8001
      MAX_WORKERS: ${ANALYZER_MAX_WORKERS:-5}
      BATCH_SIZE: ${ANALYZER_BATCH_SIZE:-10}
      ANALYSIS_CACHE_TTL_HOURS: ${ANALYSIS_CACHE_TTL_HOURS:-24}
      PATTERN_CACHE_TTL_HOURS: ${PATTERN_CACHE_TTL_HOURS:-168}
      ENABLE_STEMMING: ${ENABLE_STEMMING:-true}
      ENABLE_LEMMATIZATION: ${ENABLE_LEMMATIZATION:-true}
      REMOVE_STOPWORDS: ${REMOVE_STOPWORDS:-true}
      LANGUAGE: ${ANALYZER_LANGUAGE:-ru}
      CELERY_ENABLED: ${CELERY_ENABLED:-false}
    networks:
      - techstats-network
    depends_on:
      redis:
        condition: service_healthy
      vacancy-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/api/v1/health/ready')"]
      interval: 30s
      timeout: 10s
      retries: 5

  websocket-service:
    build:
      <<: *backend-build
      dockerfile: websocket-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: *service-env
      ANALYZER_SERVICE_URL: http://analyzer-service:8002
      VACANCY_SERVICE_URL: http://vacancy-service:8001
      CACHE_SERVICE_URL: http://cache-service:8003
      WEBSOCKET_PING_INTERVAL: ${WEBSOCKET_PING_INTERVAL:-20}
      WEBSOCKET_PING_TIMEOUT: ${WEBSOCKET_PING_TIMEOUT:-30}
      MAX_CONNECTIONS_PER_IP: ${MAX_CONNECTIONS_PER_IP:-10}
      MAX_TOTAL_CONNECTIONS: ${MAX_TOTAL_CONNECTIONS:-1000}
      CONNECTION_TIMEOUT: ${CONNECTION_TIMEOUT:-300}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-3600}
      CLEANUP_INTERVAL_SECONDS: ${WEBSOCKET_CLEANUP_INTERVAL_SECONDS:-60}
      PROGRESS_UPDATE_INTERVAL: ${PROGRESS_UPDATE_INTERVAL:-0.5}
      BATCH_SIZE_FOR_PROGRESS: ${BATCH_SIZE_FOR_PROGRESS:-10}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ADMIN_TOKEN: ${WEBSOCKET_ADMIN_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8080"]}
    networks:
      - techstats-network
    depends_on:
      redis:
        condition: service_healthy
      analyzer-service:
        condition: service_healthy
      vacancy-service:
        condition: service_healthy
      cache-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/api/v1/health/ready')"]
      interval: 30s
      timeout: 10s
      retries: 5

  frontend:
    build:
      context: ./frontend
      target: runtime
    restart: unless-stopped
    networks:
      - techstats-network
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - techstats-network
    depends_on:
      frontend:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
      vacancy-service:
        condition: service_healthy
      analyzer-service:
        condition: service_healthy
      cache-service:
        condition: service_healthy
      websocket-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - techstats-network
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-200h}
      - --web.enable-lifecycle
    depends_on:
      redis-exporter:
        condition: service_started

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
    networks:
      - techstats-network
    depends_on:
      prometheus:
        condition: service_started

volumes:
  redis-data:
  mongo-data:
  prometheus-data:
  grafana-data:

networks:
  techstats-network:
    driver: bridge
