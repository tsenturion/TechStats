global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: "techstats"
    service: "techstats"

scrape_configs:
  - job_name: "api-gateway"
    static_configs:
      - targets: ["api-gateway:8000"]
        labels:
          service: "api-gateway"
    metrics_path: "/api/v1/metrics"
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: "vacancy-service"
    static_configs:
      - targets: ["vacancy-service:8001"]
        labels:
          service: "vacancy-service"
    metrics_path: "/api/v1/metrics"
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: "analyzer-service"
    static_configs:
      - targets: ["analyzer-service:8002"]
        labels:
          service: "analyzer-service"
    metrics_path: "/api/v1/metrics"
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: "cache-service"
    static_configs:
      - targets: ["cache-service:8003"]
        labels:
          service: "cache-service"
    metrics_path: "/api/v1/metrics"
    scrape_interval: 15s
    scrape_timeout: 10s

  - job_name: "websocket-service"
    static_configs:
      - targets: ["websocket-service:8004"]
        labels:
          service: "websocket-service"
    metrics_path: "/api/v1/metrics"
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: "redis"
